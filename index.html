<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20Y Pulse</title>
<meta name="theme-color" content="#000000">
<style>
  body { 
    font-family: -apple-system, sans-serif; 
    background: #000; color: #0f0; 
    text-align: center; padding: 20px; 
    margin: 0;
  }
  .card { 
    background: #111; border: 1px solid #0f0; 
    border-radius: 16px; padding: 24px; margin: 20px 0;
  }
  h1 { font-size: 24px; margin: 0 0 8px 0; }
  .score { font-size: 72px; font-weight: 900; margin: 16px 0; }
  .ok { color: #0f0; } .fail { color: #f00; }
  button { 
    background: #0f0; color: #000; border: none; 
    padding: 16px 32px; font-size: 18px; font-weight: 700;
    border-radius: 12px; width: 100%; margin-top: 16px;
  }
  .small { font-size: 12px; opacity: 0.6; margin-top: 24px; }
</style>
</head>
<body>
  <h1>20Y PULSE</h1>
  <div class="card">
    <div>STABILITY SCORE</div>
    <div id="score" class="score">...</div>
    <div id="regla">Cargando...</div>
  </div>
  <button onclick="checkPulse()">COMPROBAR AHORA</button>
  <div class="small">v8.0.0 | Regla: >=7 o reset</div>

<script>
const API = 'https://two0y-core-api.onrender.com/atlas/pulso';

async function checkPulse() {
  const scoreEl = document.getElementById('score');
  const reglaEl = document.getElementById('regla');
  scoreEl.textContent = '...';
  
  try {
    const r = await fetch(API);
    const d = await r.json();
    
    scoreEl.textContent = d.stability_20y;
    scoreEl.className = 'score ' + (d.stability_20y >= 1 ? 'ok' : 'fail');
    reglaEl.textContent = d.stability_20y >= 1 ? 'SISTEMA ESTABLE. SHIP.' : 'RESET REQUERIDO';
    
  } catch(e) {
    scoreEl.textContent = 'ERR';
    scoreEl.className = 'score fail';
    reglaEl.textContent = 'API OFFLINE';
  }
}

// Auto-check al abrir
checkPulse();
</script>
</body>
</html>
