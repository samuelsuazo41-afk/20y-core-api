<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20Y PULSE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00FF00">
  <link rel="icon" href="icon-192.png">
  <style>
    body { background:#000; color:#0f0; font-family:monospace; padding:20px; margin:0; }
    h1 { text-align:center; color:#0f0; margin:10px 0; }
   .card { border:2px solid #0f0; padding:20px; margin:20px 0; border-radius:8px; }
    input,select { background:#111; border:1px solid #0f0; color:#0f0; padding:8px; width:100%; margin:5px 0; font-family:monospace; }
    button { background:#0f0; color:#000; border:none; padding:10px 20px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px; }
    button:active { background:#0a0; }
   .row { display:flex; gap:10px; }
   .row input,.row select { flex:1; }
   .hidden { display:none; }
   .spith { background:#001100; border-left:4px solid #0f0; padding:15px; margin:15px 0; font-style:italic; }
  </style>
</head>
<body>
  <h1>20Y PULSE</h1>
  
  <div class="card" id="viewMode">
    <h2 style="margin-top:0;">MENÚ USUARIO</h2>
    <p><strong>Nombre:</strong> <span id="viewName">Samuel Suazo</span></p>
    <p><strong>Estado:</strong> <span id="viewEstado">Activo</span></p>
    <p><strong>Puntos 20Y:</strong> <span id="viewPuntos">127</span></p>
    <p><strong>Nivel:</strong> <span id="viewNivel">4/4</span></p>
    <p><strong>Stability Score:</strong> <span id="viewStability">98%</span></p>
    <button onclick="editar()">EDITAR DATOS</button>
  </div>

  <div class="card hidden" id="editMode">
    <h2 style="margin-top:0;">EDITAR USUARIO</h2>
    <label>Nombre:</label>
    <input type="text" id="editName">
    <label>Estado:</label>
    <input type="text" id="editEstado">
    <div class="row">
      <div><label>Puntos 20Y:</label><input type="number" id="editPuntos"></div>
      <div><label>Nivel:</label><input type="text" id="editNivel"></div>
    </div>
    <label>Stability Score:</label>
    <input type="text" id="editStability">
    <button onclick="guardar()">GUARDAR</button>
    <button onclick="cancelar()" style="background:#333;color:#0f0;margin-top:5px;">CANCELAR</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">20Y SPITH</h2>
    <div id="spithBox" class="spith">Activa notificaciones para recibir tu Spith diario.</div>
    <label>Frecuencia:</label>
    <select id="frecuencia">
      <option value="diario">Diario 09:00h</option>
      <option value="semanal">Semanal Lunes 09:00h</option>
    </select>
    <button id="notifBtn" onclick="activarNotificaciones()">ACTIVAR SPITH + NOTIFICACIONES</button>
    <button onclick="generarSpithYa()" style="background:#333;color:#0f0;margin-top:5px;">GENERAR SPITH AHORA</button>
  </div>

  <div style="text-align:center; margin-top:30px; opacity:0.7;">
    <p>20Y CORE SYSTEMS</p>
    <p style="font-size:12px;">SALT, GIRONA, SPAIN</p>
  </div>

  <script>
    const spiths = [
      "Nivel {nivel}. {puntos} puntos 20Y. Stability {stability}. Hoy dominas. Ejecuta sin dudar.",
      "{nombre}, tu estado {estado} con {puntos} 20Y confirma progreso. Nivel {nivel}. Ataca el día.",
      "Stability {stability}. {puntos} 20Y acumulados. Eres Nivel {nivel}. La consistencia es tu arma.",
      "20Y PULSE activo. {nombre}, {puntos} puntos. Sube el standard. Nivel {nivel} exige más.",
      "Estado {estado}. Stability {stability}. No pares. {puntos} 20Y no se ganan solos. Nivel {nivel}."
    ];

    function cargar() {
      document.getElementById('viewName').innerText = localStorage.getItem('20y_name') || 'Samuel Suazo';
      document.getElementById('viewEstado').innerText = localStorage.getItem('20y_estado') || 'Activo';
      document.getElementById('viewPuntos').innerText = localStorage.getItem('20y_puntos') || '127';
      document.getElementById('viewNivel').innerText = localStorage.getItem('20y_nivel') || '4/4';
      document.getElementById('viewStability').innerText = localStorage.getItem('20y_stability') || '98%';
      document.getElementById('frecuencia').value = localStorage.getItem('20y_freq') || 'diario';
      mostrarUltimoSpith();
      checkNotifStatus();
    }

    function editar() {
      document.getElementById('editName').value = localStorage.getItem('20y_name') || 'Samuel Suazo';
      document.getElementById('editEstado').value = localStorage.getItem('20y_estado') || 'Activo';
      document.getElementById('editPuntos').value = localStorage.getItem('20y_puntos') || '127';
      document.getElementById('editNivel').value = localStorage.getItem('20y_nivel') || '4/4';
      document.getElementById('editStability').value = localStorage.getItem('20y_stability') || '98%';
      document.getElementById('viewMode').classList.add('hidden');
      document.getElementById('editMode').classList.remove('hidden');
    }

    function guardar() {
      localStorage.setItem('20y_name', document.getElementById('editName').value);
      localStorage.setItem('20y_estado', document.getElementById('editEstado').value);
      localStorage.setItem('20y_puntos', document.getElementById('editPuntos').value);
      localStorage.setItem('20y_nivel', document.getElementById('editNivel').value);
      localStorage.setItem('20y_stability', document.getElementById('editStability').value);
      cargar();
      document.getElementById('editMode').classList.add('hidden');
      document.getElementById('viewMode').classList.remove('hidden');
    }

    function cancelar() {
      document.getElementById('editMode').classList.add('hidden');
      document.getElementById('viewMode').classList.remove('hidden');
    }

    function generarTextoSpith() {
      const data = {
        nombre: localStorage.getItem('20y_name') || 'Samuel Suazo',
        estado: localStorage.getItem('20y_estado') || 'Activo',
        puntos: localStorage.getItem('20y_puntos') || '127',
        nivel: localStorage.getItem('20y_nivel') || '4/4',
        stability: localStorage.getItem('20y_stability') || '98%'
      };
      let template = spiths[Math.floor(Math.random() * spiths.length)];
      return template.replace(/{(\w+)}/g, (_, key) => data[key]);
    }

    function generarSpithYa() {
      const spith = generarTextoSpith();
      document.getElementById('spithBox').innerText = spith;
      localStorage.setItem('20y_lastSpith', spith);
      localStorage.setItem('20y_lastSpithDate', new Date().toLocaleString());
      if (Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification('20Y SPITH', { body: spith, icon: 'icon-192.png', badge: 'icon-192.png' });
        });
      }
    }

    function mostrarUltimoSpith() {
      const last = localStorage.getItem('20y_lastSpith');
      const date = localStorage.getItem('20y_lastSpithDate');
      if (last) document.getElementById('spithBox').innerText = last + '\n\nGenerado: ' + date;
    }

    async function activarNotificaciones() {
      localStorage.setItem('20y_freq', document.getElementById('frecuencia').value);
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        document.getElementById('notifBtn').innerText = 'NOTIFICACIONES ACTIVAS';
        document.getElementById('notifBtn').style.background = '#0a0';
        navigator.serviceWorker.ready.then(reg => {
          reg.active.postMessage({ type: 'SCHEDULE_SPITH', freq: localStorage.getItem('20y_freq') });
        });
        generarSpithYa();
      } else {
        alert('Activa notificaciones en Ajustes → Apps → 20Y → Notificaciones');
      }
    }

    function checkNotifStatus() {
      if (Notification.permission === 'granted') {
        document.getElementById('notifBtn').innerText = 'NOTIFICACIONES ACTIVAS';
        document.getElementById('notifBtn').style.background = '#0a0';
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
    cargar();
  </script>
</body>
</html>
