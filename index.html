<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>20Y Pulse</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="20Y Core: Check tu Stability Score. >=7 o reset.">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;20Y Pulse&quot;,&quot;short_name&quot;:&quot;20Y&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#000000&quot;,&quot;theme_color&quot;:&quot;#000000&quot;}">

<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
    background: #000; color: #00ff00; 
    text-align: center; padding: 16px; margin: 0;
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
  }
  .container { max-width: 400px; margin: 0 auto; width: 100%; }
  .card { 
    background: #0a0a0a; border: 2px solid #00ff00; 
    border-radius: 20px; padding: 32px 24px; margin: 16px 0;
    box-shadow: 0 0 20px rgba(0,255,0,0.2);
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; letter-spacing: 2px; opacity: 0.8; }
  .score { font-size: 96px; font-weight: 900; margin: 8px 0; line-height: 1; }
  .ok { color: #00ff00; text-shadow: 0 0 10px #00ff00; } 
  .fail { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
  .label { font-size: 14px; opacity: 0.6; margin-bottom: 8px; }
  .regla { font-size: 16px; font-weight: 700; margin-top: 12px; min-height: 24px; }
  button { 
    background: #00ff00; color: #000; border: none; 
    padding: 18px 32px; font-size: 18px; font-weight: 800;
    border-radius: 14px; width: 100%; margin-top: 20px;
    cursor: pointer; transition: all 0.2s;
  }
  button:active { transform: scale(0.98); background: #00cc00; }
  .footer { font-size: 11px; opacity: 0.4; margin-top: 32px; line-height: 1.4; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
  <div class="container">
    <h1>20Y PULSE</h1>
    <div class="card">
      <div class="label">STABILITY SCORE</div>
      <div id="score" class="score pulse">...</div>
      <div id="regla" class="regla">Iniciando...</div>
    </div>
    <button onclick="checkPulse()">COMPROBAR AHORA</button>
    <div class="footer">
      v8.0.0 | Regla: >=7 o reset<br>
      Add to Home Screen para instalar
    </div>
  </div>

<script>
const API = 'https://two0y-core-api.onrender.com/atlas/pulso';

async function checkPulse() {
  const scoreEl = document.getElementById('score');
  const reglaEl = document.getElementById('regla');
  scoreEl.textContent = '...';
  scoreEl.classList.add('pulse');
  
  try {
    const start = performance.now();
    const r = await fetch(API, { cache: 'no-store' });
    const ms = Math.round(performance.now() - start);
    const d = await r.json();
    
    scoreEl.classList.remove('pulse');
    scoreEl.textContent = d.stability_20y;
    scoreEl.className = 'score ' + (d.stability_20y >= 1 ? 'ok' : 'fail');
    
    if (d.stability_20y >= 1) {
      reglaEl.textContent = `ESTABLE. SHIP. ${ms}ms`;
    } else {
      reglaEl.textContent = 'RESET REQUERIDO';
    }
    
  } catch(e) {
    scoreEl.classList.remove('pulse');
    scoreEl.textContent = 'ERR';
    scoreEl.className = 'score fail';
    reglaEl.textContent = 'API OFFLINE';
  }
}

// Auto-check al abrir + cada 30 seg
checkPulse();
setInterval(checkPulse, 30000);

// Prevenir zoom doble tap
document.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
