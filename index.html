<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20Y PULSE</title>
  <link rel="manifest" href="manifest.json?v=9">
  <meta name="theme-color" content="#00FF00">
  <link rel="icon" href="icon-192.png">
  <style>
    body { background:#000; color:#0f0; font-family:monospace; padding:20px; margin:0; }
    h1 { text-align:center; color:#0f0; margin:10px 0; }
    h2 { margin:15px 0 10px 0; font-size:18px; }
  .card { border:2px solid #0f0; padding:20px; margin:20px 0; border-radius:8px; }
    input,select,textarea { background:#111; border:1px solid #0f0; color:#0f0; padding:8px; width:100%; margin:5px 0; font-family:monospace; box-sizing:border-box; }
    button { background:#0f0; color:#000; border:none; padding:10px 20px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px; }
    button:active { background:#0a0; }
    button.secondary { background:#333; color:#0f0; }
    button.danger { background:#500; color:#f00; }
    button.plan { background:#050; color:#0f0; border:1px solid #0f0; }
    button.coach { background:#0a0; color:#000; border:1px solid #0f0; }
  .row { display:flex; gap:10px; }
  .row input,.row select { flex:1; }
  .hidden { display:none; }
  .spith { background:#001100; border-left:4px solid #0f0; padding:15px; margin:15px 0; font-style:italic; }
  .coach-box { background:#001a00; border-left:4px solid #0a0; padding:15px; margin:15px 0; }
  .coach-box h3 { color:#0a0; margin:0 0 10px 0; }
  .objetivo { border:1px solid #0f0; padding:10px; margin:10px 0; border-radius:4px; }
  .objetivo-header { display:flex; justify-content:space-between; align-items:center; }
  .progress { background:#111; height:8px; border-radius:4px; margin:8px 0; }
  .progress-bar { background:#0f0; height:100%; border-radius:4px; transition:width 0.3s; }
  .tabs { display:flex; gap:5px; margin-bottom:15px; flex-wrap:wrap; }
  .tab { flex:1; padding:8px; background:#111; border:1px solid #0f0; cursor:pointer; text-align:center; min-width:80px; }
  .tab.active { background:#0f0; color:#000; font-weight:bold; }
  .orden { background:#110000; border:2px solid #f00; padding:15px; margin:15px 0; }
  .orden h3 { color:#f00; margin:0 0 10px 0; }
  .planbox { background:#001a00; border:2px solid #0f0; padding:15px; margin:15px 0; }
  .planbox h3 { color:#0f0; margin:0 0 10px 0; }
  .planbox ol { margin:10px 0; padding-left:20px; }
  .planbox li { margin:8px 0; }
  .kpi { display:flex; justify-content:space-between; margin:8px 0; }
  .historial { max-height:200px; overflow-y:auto; border:1px solid #0a0; padding:10px; margin-top:10px; }
  .historial-item { border-bottom:1px solid #030; padding:8px 0; font-size:12px; }
  </style>
</head>
<body>
  <h1>20Y PULSE</h1>
  
  <div class="tabs">
    <div class="tab" onclick="showTab('usuario')">USUARIO</div>
    <div class="tab active" onclick="showTab('objetivos')">OBJETIVOS</div>
    <div class="tab" onclick="showTab('spith')">SPITH</div>
    <div class="tab" onclick="showTab('ejecucion')">EJECUCIÓN</div>
    <div class="tab" onclick="showTab('coach')">COACH</div>
  </div>

  <div class="card hidden" id="tab-usuario">
    <div id="viewMode">
      <h2>MENÚ USUARIO</h2>
