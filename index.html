<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20Y PULSE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00FF00">
</head>
<body>
  <h1>20Y PULSE</h1>
  <div id="app">CARGANDO...</div>

<script>
// PEGAR AQUÍ TODO EL JAVASCRIPT QUE TE DI ANTES

function getObjetivos() {
  return JSON.parse(localStorage.getItem('20y_objetivos') || '[]');
}

function setObjetivos(arr) {
  localStorage.setItem('20y_objetivos', JSON.stringify(arr));
}

function cancelarObjetivo() {
  // tu función cancelar
}

function guardarObjetivo() {
  const id = document.getElementById('objId').value || Date.now().toString();
  const titulo = document.getElementById('objTitulo').value;
  const meta = parseInt(document.getElementById('objMeta').value) || 1;
  const actual = parseInt(document.getElementById('objActual').value) || 0;
  
  const obj = {
    id, titulo,
    desc: document.getElementById('objDesc').value,
    meta, actual,
    categoria: document.getElementById('objCategoria').value
  };
  
  const objs = getObjetivos().filter(o => o.id !== id);
  objs.push(obj);
  setObjetivos(objs);
  cancelarObjetivo();

  // NOTIFICACIÓN SIMPLE
  if (Notification.permission === 'granted' && actual >= meta) {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification('20Y COMPLETADO', {
        body: `Objetivo: ${titulo} - 100%`,
        icon: 'icon-192.png',
        tag: '20y-obj'
      });
    });
  }
}

// AQUÍ VA EL RESTO DE TU CÓDIGO JS

</script>
</body>
</html>
